services:
  postgres:
    image: postgres:16
    container_name: multicatalogo_db
    profiles: ["infra", "all"]
    environment:
      POSTGRES_USER: multicatalogo_user
      POSTGRES_PASSWORD: multicatalogo_pass
      POSTGRES_DB: multicatalogo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multicatalogo_user -d multicatalogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: multicatalogo_redis
    profiles: ["infra", "all"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: multicatalogo_api
    profiles: ["app", "all"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: multicatalogo_user
      DB_PASSWORD: multicatalogo_pass
      DB_NAME: multicatalogo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Simulación de fallas para demostrar el ROLLBACK (vacío/0 = desactivado)
      CHECKOUT_FALLA_SIMULADA: ${CHECKOUT_FALLA_SIMULADA:-false}
      CHECKOUT_PAUSA_COMMIT: ${CHECKOUT_PAUSA_COMMIT:-0}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
