pid /tmp/nginx-local/nginx.pid;
error_log /tmp/nginx-local/logs/error.log;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-local/logs/access.log;
    client_body_temp_path /tmp/nginx-local/temp/client_body;
    proxy_temp_path /tmp/nginx-local/temp/proxy;
    fastcgi_temp_path /tmp/nginx-local/temp/fastcgi;
    uwsgi_temp_path /tmp/nginx-local/temp/uwsgi;
    scgi_temp_path /tmp/nginx-local/temp/scgi;

    upstream frontend {
        server 127.0.0.1:4173;
    }

    upstream backend {
        server 127.0.0.1:3000;
    }

    upstream saas {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Proxy a backend Go
        location /api/tx/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy a FastAPI SaaS
        location /api/saas/ {
            proxy_pass http://saas/api/saas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Legacy /api/ routes (backend Go)
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend React PWA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
